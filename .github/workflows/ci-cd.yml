name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build and Test with Maven
        run: mvn clean verify

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build all targets
        run: |
          for target in linux.x64 macos.x64 windows.x64 portable; do
            chmod +x release/release.$target.sh
            ./release/release.$target.sh
          done
          mkdir -p dist
          mv release/dropfile-*.tar.gz dist/

      - name: Update Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: 'Nightly Build (Master)'
          body: |
            Build based on master:
            - Linux x64 (includes JRE)
            - macOS x64 (includes JRE)
            - Windows x64 (includes JRE)
            - Portable (NO JRE)
          prerelease: true
          files: dist/dropfile-*.tar.gz