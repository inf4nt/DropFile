spring.application.name=dropfile-daemon
spring.lifecycle.timeout-per-shutdown-phase=-1
spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=30s

dropfile.daemon.application-home.directory=${user.dir}
dropfile.daemon.daemon-secrets.directory=${dropfile.daemon.application-home.directory}/conf
dropfile.daemon.installation-seed.directory=${dropfile.daemon.application-home.directory}/conf
dropfile.daemon.downloads.directory=${dropfile.daemon.application-home.directory}/downloads

#dropfile.daemon.external-host=http://dropfile.example.com

dropfile.daemon.download.orchestrator.max-queue-size=15
dropfile.daemon.download.orchestrator.active-queue-size=10
dropfile.daemon.download.procedure.thread-size=2

dropfile.daemon.share.add.hash.execution-timeout=60s

dropfile.daemon.handshake.client.http.request-timeout=30s

dropfile.daemon.tunnel.client.manifest.chunk-size=524288
dropfile.daemon.tunnel.client.compress.enabled=true
dropfile.daemon.tunnel.client.stream.max-size=5242880
dropfile.daemon.tunnel.client.stream.deadline-timeout=30s
dropfile.daemon.tunnel.client.http.request-timeout=30s

dropfile.daemon.tunnel.server.compress.level=3
dropfile.daemon.tunnel.server.chunk.limit.max=4194304
dropfile.daemon.tunnel.server.chunk.limit.min=131072

dropfile.daemon.quickshare.secure.compress.level=3
dropfile.daemon.quickshare.async.request-timeout=24h
dropfile.daemon.quickshare.insecure.compress.enabled=true
dropfile.daemon.quickshare.insecure.compress.level=3

dropfile.daemon.gc.rate.interval=5m
dropfile.daemon.idle.rate.interval=5m
dropfile.daemon.idle.shutdown-timeout=30m

dropfile.daemon.server.servlet.input.stream.timeout-millis=30000
dropfile.daemon.server.servlet.input.stream.limit.max=131072

dropfile.daemon.server.servlet.output.stream.timeout-millis=30000

dropfile.daemon.server.servlet.rate-request.handshake.limit.max=4
dropfile.daemon.server.servlet.rate-request.tunnel.limit.max=20
dropfile.daemon.server.servlet.rate-request.quickshare.limit.max=20

dropfile.daemon.security.replay.ttl-seconds=30
dropfile.daemon.security.replay.max-future-drift-seconds=10

server.port=18181
server.tomcat.max-connections=80
server.tomcat.accept-count=20
